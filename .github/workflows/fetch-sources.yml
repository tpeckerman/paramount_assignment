name: Fetch sources

# Runs the Playwright fetcher on a GitHub runner and commits whatever it manages to
# retrieve straight back into the repo. Click "Run workflow" on the Actions tab.
#
# HONEST CAVEAT, read before trusting a failure here. GitHub runners use datacenter IP
# addresses, which Cloudflare and AWS WAF treat with far more suspicion than a home
# broadband address. So this may fail on exactly the hosts a laptop sails through,
# especially ofcom.org.uk. A failure here is NOT evidence that a document is unreachable -
# it is evidence that this particular route is blocked. The laptop and the F12 snippet in
# DOWNLOAD_SNIPPET.md remain the reliable routes.
#
# It is still worth running, because the non-Cloudflare hosts (legislation.gov.uk,
# EUR-Lex, solidarites.gouv.fr) may well come through, and every document it gets is one
# fewer to save by hand.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Space-separated doc_ids, or blank for all outstanding (e.g. "UK-S1 FR-R2")'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pypdf
          python -m playwright install --with-deps chromium

      - name: Fetch
        id: fetch
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            python pipeline/fetch_with_browser.py --only ${{ inputs.only }} 2>&1 | tee fetch.log
          else
            python pipeline/fetch_with_browser.py 2>&1 | tee fetch.log
          fi

      - name: Import whatever arrived
        continue-on-error: true
        run: |
          ls -la sources/originals/incoming/ 2>/dev/null || echo "nothing downloaded"
          python pipeline/import_saved.py 2>&1 | tee -a fetch.log || true

      - name: Re-check and rebuild
        continue-on-error: true
        run: |
          python pipeline/fetch_originals.py --check 2>&1 | tail -20
          python pipeline/build_rules_table.py 2>&1 | tail -5
          python pipeline/build_worklist.py 2>&1 | tail -3

      - name: Quote integrity
        continue-on-error: true
        run: python pipeline/verify_rules.py --with-quotes 2>&1 | tail -30

      - name: Commit anything retrieved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sources/ rules/ DOWNLOAD_THESE.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing retrieved - no commit. See the fetch log above for why each"
            echo "document failed, then use DOWNLOAD_SNIPPET.md to save them by hand."
          else
            git commit -m "Fetch sources via GitHub Actions

          Retrieved by pipeline/fetch_with_browser.py on a runner. Each file was
          checked against its manifest 'expect' phrase before being written, and
          re-checked on import, so anything committed here contains the phrase that
          identifies the genuine document rather than a challenge or navigation page."
            git push
            echo "Committed. Pull to get the files."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fetch-log
          path: fetch.log
          if-no-files-found: ignore
