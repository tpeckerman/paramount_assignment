name: verify rule table

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl pypdf

      - name: Schema and consistency checks
        run: python out_of_scope/pipeline/verify_rules.py

      - name: Confirm the workbook matches the build script
        run: |
          # The workbook is a binary blob, so a stale commit is easy to miss.
          # Rebuild it and fail if the regenerated CSV mirrors differ from what
          # is committed - that is what makes a rule change reviewable in a PR.
          cp rules/csv/Rules.csv /tmp/Rules.committed.csv
          python out_of_scope/pipeline/build_rules_table.py
          if ! diff -q /tmp/Rules.committed.csv rules/csv/Rules.csv; then
            echo "::error::rules/csv is out of date - re-run out_of_scope/pipeline/build_rules_table.py and commit the result"
            diff /tmp/Rules.committed.csv rules/csv/Rules.csv | head -40
            exit 1
          fi
          echo "committed CSVs match the build script"

      - name: Report source-document status
        continue-on-error: true
        run: |
          # Genuinely informational: reports link health and drift, which depend on
          # the network and on publishers, so a red build here would mean someone
          # else's website changed rather than this repo being wrong.
          python out_of_scope/pipeline/fetch_originals.py --check || true

      - name: Inventory is current
        run: python out_of_scope/pipeline/build_inventory.py --check

      - name: Quote integrity
        # BLOCKING. This used to carry continue-on-error AND `|| true`, dating from
        # when sources/originals/ was empty and every quote was unverifiable. All 20
        # sources have been collected since, so the check works, and leaving it
        # non-blocking meant three documents claimed a rule without a quote "fails
        # the build" while nothing of the sort happened. A reviewer blanked a quote
        # and CI stayed green.
        run: python out_of_scope/pipeline/verify_rules.py --with-quotes

      - name: Test-case claims and stale numbers in prose
        run: python out_of_scope/pipeline/verify_cases.py

      - name: Process diagram renders
        run: python out_of_scope/pipeline/build_diagrams.py --check
